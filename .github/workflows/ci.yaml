name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kuhnroyal/flutter-fvm-config-action/config@v3
        id: fvm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm.outputs.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: example
      - run: dart pub publish --dry-run

  # Guards the supported SDK floor (pubspec.yaml environment): lib/ must compile
  # and the core tests must pass on the oldest supported Flutter. Dev tooling is
  # downgraded here because the latest very_good_analysis needs a newer Dart.
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          cache: true
      - run: sed -i 's/^  very_good_analysis:.*/  very_good_analysis: ^8.0.0/; s/^  fake_async:.*/  fake_async: ^1.3.2/' pubspec.yaml
      - run: flutter pub get
      - run: flutter analyze lib
      # These three files use test-only APIs added after 3.29 (Tristate, flagsCollection).
      - run: flutter test test/sileo_controller_test.dart test/sileo_shape_painter_test.dart test/sileo_spring_test.dart test/sileo_toaster_test.dart
