version: 0.1.0-dev.1
repository: https://github.com/korkmazmert/sileo_toast
issue_tracker: https://github.com/korkmazmert/sileo_toast/issues
topics:
  - toast
  - animation
  - notification
  - snackbar
  - ui

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
